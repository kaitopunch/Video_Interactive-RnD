[versions]
# agp, kotlin, composeBom and the androidx/kotlinx versions below are the set PhoneCleanerDemo builds
# with on this machine (Pion/PhoneCleanerDemo/gradle/libs.versions.toml). Kotlin stays on 2.3.x there
# because of KSP; this project has no KSP, but keeping the same line keeps both builds on one cache.
agp = "9.2.1"
kotlin = "2.3.21"
composeBom = "2026.02.01"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
coroutines = "1.11.0"
serialization = "1.11.0"   # the script is read as a JsonElement tree; @Serializable is used only by the nav routes
navigation = "2.10.0"      # type-safe @Serializable routes (LLM.md §7) — PhoneCleanerDemo's version
koin = "4.2.2"             # LLM.md §6 — PhoneCleanerDemo's version
# RESOLVED 2026-09-29 from Google Maven maven-metadata.xml: newest release with no alpha/beta/rc.
media3 = "1.11.1"
junit = "4.13.2"
turbine = "1.2.1"
# Measurement and device tests (plans/261001-1130-quality-perf-device-tests). RESOLVED 2026-10-01 from
# Google Maven / Maven Central maven-metadata.xml: newest release with no alpha/beta/rc.
benchmark = "1.5.0"        # Macrobenchmark + BaselineProfileRule, in :benchmark only
uiautomator = "2.4.0"
profileinstaller = "1.4.1" # installs app/src/main/baseline-prof.txt on devices without Play's cloud profiles
tracing = "1.2.0"          # the trace sections the :benchmark suite reads; the version Compose already pulls in
# Not the newest: runner 1.7.0 / ext-junit 1.3.0 need concurrent-futures 1.2.0, and AGP pins the androidTest
# classpath to the app's runtime one, which has 1.1.0 — the build fails to resolve rather than pick a version.
androidxTestRunner = "1.6.1"
androidxTestExtJunit = "1.2.1"
robolectric = "4.17"       # JVM Android runtime for the Compose UI suite: not a mocking library (LLM.md §9)

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-tracing-ktx = { group = "androidx.tracing", name = "tracing-ktx", version.ref = "tracing" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
# No kotlin-android plugin: AGP 9 ships built-in Kotlin, and applying it fails with
# "Cannot add extension with name 'kotlin'" (established in PhoneCleanerDemo, 2026-09-02).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[bundles]
compose = [
    "androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3", "androidx-activity-compose",
    "androidx-lifecycle-runtime-compose", "androidx-lifecycle-viewmodel-compose",
    "androidx-navigation-compose",
]
media3 = ["androidx-media3-exoplayer", "androidx-media3-ui-compose"]
koin = ["koin-android", "koin-androidx-compose"]
test-unit = ["junit", "kotlinx-coroutines-test", "turbine", "koin-test"]
# Compose UI tests on the JVM under Robolectric: device configurations as @Config qualifiers (LLM.md §9)
test-ui = ["androidx-compose-ui-test-junit4", "robolectric", "androidx-test-ext-junit"]
test-device = ["junit", "androidx-test-runner", "androidx-test-ext-junit", "kotlinx-coroutines-test"]
